name: perpeto-dev

# Local development backing services only.
#
# This stack deliberately runs no Perpeto service images. The API, engine and
# workers run from `cargo run` on the host so the edit/build loop stays fast and
# the API can bind 0.0.0.0 itself for a phone on the LAN. Compose supplies just
# the stateful dependencies.
#
#   docker compose -f deploy/compose/docker-compose.dev.yml up -d
#
# Both services publish to 127.0.0.1 only. Nothing outside this host needs them:
# a phone talks to the API, never to PostgreSQL, and these are well-known
# development passwords that must not be reachable from any network.
#
# The host ports are overridable, because a machine running several Docker
# projects will eventually collide:
#
#   PERPETO_DEV_DB_PORT=15432 PERPETO_DEV_REDIS_PORT=16379 \
#     docker compose -f deploy/compose/docker-compose.dev.yml up -d
#
# Note that "address already in use" more often means a *second Docker daemon*
# already holds the port than a genuine clash: `docker context ls` shows which
# daemon plain `docker` commands target, and containers on one daemon are
# invisible to the other while still owning the host port.
#
# `scripts/bootstrap-db-roles.sql` is mounted into the Postgres init hook, so
# `perpeto_migrator` and `perpeto_app` exist the first time the volume is
# created. That hook runs only on a *fresh* volume: after changing the script,
# or if the roles are missing, `down -v` first — `up -d` alone will not re-run it.

services:
  postgres:
    image: postgres:18.4-bookworm@sha256:7cfd7f5e307dbd8cf5d88761b22934c042a749362c0ab7efc41805572d58b3a3
    restart: unless-stopped
    environment:
      POSTGRES_USER: perpeto
      POSTGRES_PASSWORD: perpeto
      POSTGRES_DB: perpeto
    ports: ["127.0.0.1:${PERPETO_DEV_DB_PORT:-5432}:5432"]
    volumes:
      - perpeto-dev-postgres:/var/lib/postgresql
      - ../../scripts/bootstrap-db-roles.sql:/docker-entrypoint-initdb.d/10-bootstrap-db-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perpeto -d perpeto"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7.4.5-bookworm
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports: ["127.0.0.1:${PERPETO_DEV_REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  perpeto-dev-postgres:
