name: perpeto-dev

# Local development backing services only.
#
# This stack deliberately runs no Perpeto service images. The API, engine and
# workers are meant to run from `cargo run` on the host so the local edit/build
# loop stays fast and the mobile client can reach the API over the LAN. Compose
# supplies just the stateful dependencies.
#
# Ports are published on 0.0.0.0 rather than 127.0.0.1 (unlike the staging
# stack) so a phone running Expo Go can reach the host. This stack is for a
# trusted local network and uses well-known development passwords; never expose
# it to an untrusted network or reuse these values anywhere real.
#
#   docker compose -f deploy/compose/docker-compose.dev.yml up -d
#
# `scripts/bootstrap-db-roles.sql` is mounted into the Postgres init hook, so
# `perpeto_migrator` and `perpeto_app` exist the first time the volume is
# created. Changing that file afterwards requires `down -v` to re-run it.

services:
  postgres:
    image: postgres:18.4-bookworm@sha256:7cfd7f5e307dbd8cf5d88761b22934c042a749362c0ab7efc41805572d58b3a3
    restart: unless-stopped
    environment:
      POSTGRES_USER: perpeto
      POSTGRES_PASSWORD: perpeto
      POSTGRES_DB: perpeto
    ports: ["5432:5432"]
    volumes:
      - perpeto-dev-postgres:/var/lib/postgresql
      - ../../scripts/bootstrap-db-roles.sql:/docker-entrypoint-initdb.d/10-bootstrap-db-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perpeto -d perpeto"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7.4.5-bookworm
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  perpeto-dev-postgres:
