# AWS staging override (DEC-0020), layered on docker-compose.staging.yml by
# deploy/ec2/refresh.sh. It adds Caddy for TLS and ships every container's
# logs to CloudWatch through dockerd's awslogs driver, which authenticates
# with the instance role; the containers themselves never call AWS.

x-awslogs: &awslogs
  driver: awslogs
  options:
    awslogs-region: ${AWS_REGION:?AWS_REGION is required}
    awslogs-group: ${PERPETO_LOG_GROUP:?PERPETO_LOG_GROUP is required}
    tag: "{{.Name}}"

services:
  migrate: { logging: *awslogs }
  api: { logging: *awslogs }
  engine: { logging: *awslogs }
  reconciler: { logging: *awslogs }
  preflight: { logging: *awslogs }
  rewrap: { logging: *awslogs }
  worker: { logging: *awslogs }
  postgres: { logging: *awslogs }
  redis: { logging: *awslogs }

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
    ports: ["80:80", "443:443"]
    environment:
      PERPETO_PUBLIC_HOSTS: ${PERPETO_PUBLIC_HOSTS:?PERPETO_PUBLIC_HOSTS is required}
      PERPETO_APP_HOST: ${PERPETO_APP_HOST:?PERPETO_APP_HOST is required}
      PERPETO_APP_ALIAS: ${PERPETO_APP_ALIAS:?PERPETO_APP_ALIAS is required}
    volumes:
      - ../ec2/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    logging: *awslogs

  # The Next.js web platform from perpeto-web (DEC-0021). Behind the `web`
  # profile, which refresh.sh enables only once the image can be pulled, so a
  # backend deploy never waits on the web repository.
  web:
    profiles: ["web"]
    image: ${PERPETO_WEB_IMAGE:-ghcr.io/ayenisholah/perpeto-web:main}
    restart: unless-stopped
    env_file: ["../../web.env"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m", "/app/.next/cache:rw,noexec,nosuid,size=128m,uid=1000,gid=1000"]
    depends_on:
      api:
        condition: service_healthy
    logging: *awslogs

volumes:
  caddy-data:
  caddy-config:
