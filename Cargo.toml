[workspace]
resolver = "3"
members = [
  "crates/funding-arb-domain",
  "bins/api",
  "bins/engine",
  "bins/reconciler",
  "bins/worker",
  "bins/signer",
  "bins/migrate",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
