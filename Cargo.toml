[workspace]
resolver = "3"
members = [
  "crates/funding-arb-domain",
  "crates/auth-service",
  "crates/scanner-service",
  "crates/execution-service",
  "crates/strategy-service",
  "crates/connectors",
  "crates/venue-service",
  "bins/venue-admin",
  "bins/connector-evidence",
  "bins/api",
  "bins/engine",
  "bins/reconciler",
  "bins/worker",
  "bins/signer",
  "bins/migrate",
]

[workspace.dependencies]
aes-gcm = "0.10"
async-trait = "0.1"
futures-core = "0.3"
futures-util = "0.3"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hmac = "0.12"
jsonwebtoken = { version = "10.3", default-features = false, features = ["rust_crypto"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust_decimal = { version = "1", default-features = false, features = ["std", "serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
serde_urlencoded = "0.7"
sha1 = "0.10"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "chrono", "migrate", "macros", "derive"] }
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
