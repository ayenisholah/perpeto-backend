      tags: [Venues]
      summary: Preview an exact native connector order without submission
      operationId: previewConnectorOrder
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectorOrderRequest" }
      responses:
        "200": { description: Exact native payload preview., content: { application/json: { schema: { $ref: "#/components/schemas/ConnectorOrderPreview" } } } }
        "400": { $ref: "#/components/responses/ProblemResponse" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
        "404": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/venue-accounts/{id}/orders:
    post:
      tags: [Venues]
      summary: Persist and submit one non-production connector order
      description: SANDBOX only. The unique client order id makes submission durable and submit-once. Production and SHADOW writes are rejected.
      operationId: submitConnectorOrder
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectorOrderRequest" }
      responses:
        "200": { description: Duplicate intent returned without resubmission., content: { application/json: { schema: { $ref: "#/components/schemas/ConnectorSubmission" } } } }
        "201": { description: Venue acknowledged the submission., content: { application/json: { schema: { $ref: "#/components/schemas/ConnectorSubmission" } } } }
        "202": { description: Outcome unknown; reconciliation is required., content: { application/json: { schema: { $ref: "#/components/schemas/ConnectorSubmission" } } } }
        "400": { $ref: "#/components/responses/ProblemResponse" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
        "409": { $ref: "#/components/responses/ProblemResponse" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SessionId:
      in: path
      name: session_id
      required: true
      schema: { type: string, format: uuid }
    UserId:
      in: path
      name: user_id
      required: true
      schema: { type: string, format: uuid }
    Provider:
      in: path
      name: provider
      required: true
      schema: { $ref: "#/components/schemas/SocialProvider" }
  responses:
    HealthResponse:
      description: Service is healthy.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Health" }
    ProblemResponse:
      description: Request rejected without exposing authentication secrets.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    VenueSummary:
      type: object
      additionalProperties: false
      required: [venue, display_name, products, sandbox_environment, configured_accounts]
      properties:
        venue: { type: string, enum: [BINANCE, BYBIT, OKX] }
        display_name: { type: string }
        products: { type: array, items: { type: string, enum: [SPOT, LINEAR_PERPETUAL] } }
        sandbox_environment: { type: string, enum: [TESTNET, DEMO] }
        configured_accounts: { type: integer, minimum: 0 }
    ProductConnection:
      type: object
      additionalProperties: false
      required: [id, product, environment, secret_ref, read_permission, trade_permission, withdrawal_permission, status, last_tested_at]
      properties:
        id: { type: string, format: uuid }
        product: { type: string, enum: [SPOT, LINEAR_PERPETUAL] }
        environment: { type: string, enum: [PRODUCTION, TESTNET, DEMO] }
        secret_ref: { type: [string, "null"], format: uuid }
        read_permission: { type: boolean }
        trade_permission: { type: boolean }
        withdrawal_permission: { type: [boolean, "null"] }
        status: { type: string }
        last_tested_at: { type: [string, "null"], format: date-time }
    VenueAccount:
      type: object
      additionalProperties: false
      required: [id, venue, alias, masked_identity, enabled, certification_state, reconciliation_state, connections, last_reconciled_at, created_at, tombstoned_at]
      properties:
        id: { type: string, format: uuid }
        venue: { type: string, enum: [BINANCE, BYBIT, OKX] }
        alias: { type: string }
        masked_identity: { type: string }
        enabled: { type: boolean }
        certification_state: { type: string, enum: [DISABLED, PAPER_ONLY, SHADOW, PILOT, CERTIFIED_LIVE] }
        reconciliation_state: { type: string, enum: [PENDING, RECONCILED, REQUIRED, FROZEN] }
        connections: { type: array, items: { $ref: "#/components/schemas/ProductConnection" } }
        last_reconciled_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        tombstoned_at: { type: [string, "null"], format: date-time }
    ConnectionTest:
      type: object
      additionalProperties: false
      required: [account_id, status, checked_at, checks]
      properties:
        account_id: { type: string, format: uuid }
        status: { type: string, enum: [PASS, FAIL] }
        checked_at: { type: string, format: date-time }
        checks: { type: array, items: { type: string } }
    ConnectorOrderRequest:
      type: object
      additionalProperties: false
      required: [product, symbol, side, base_quantity, limit_price, client_order_id]
      properties:
        product: { type: string, enum: [SPOT, LINEAR_PERPETUAL] }
        symbol: { type: string }
        side: { type: string, enum: [BUY, SELL] }
        base_quantity: { type: string, pattern: "^[0-9]+(\\.[0-9]+)?$" }
        limit_price: { type: string, pattern: "^[0-9]+(\\.[0-9]+)?$" }
        client_order_id: { type: string, minLength: 1, maxLength: 32 }
        reduce_only: { type: boolean, default: false }
    ConnectorOrderPreview:
      type: object
      additionalProperties: false
      required: [venue, environment, product, native_symbol, native_quantity, equivalent_base_quantity, native_price, projected_delta_usd, payload_hash, payload]
      properties:
        venue: { type: string, enum: [BINANCE, BYBIT, OKX] }
        environment: { type: string, enum: [PRODUCTION, TESTNET, DEMO] }
        product: { type: string, enum: [SPOT, LINEAR_PERPETUAL] }
        native_symbol: { type: string }
        native_quantity: { type: string }
        equivalent_base_quantity: { type: string }
        native_price: { type: string }
        projected_delta_usd: { type: string }
        payload_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        payload: { type: object, additionalProperties: true }
    ConnectorSubmission:
      type: object
      additionalProperties: false
      required: [intent_id, state, venue_order_id, client_order_id]
      properties:
        intent_id: { type: string, format: uuid }
        state: { type: string, enum: [DUPLICATE, ACKNOWLEDGED, UNKNOWN_OUTCOME, FAILED] }
        venue_order_id: { type: [string, "null"] }
        client_order_id: { type: string }
    ConnectorOrder:
      type: object
      additionalProperties: false
      required: [id, venue, venue_account_id, client_order_id, venue_order_id, symbol, product, side, base_quantity, limit_price, native_quantity, native_price, equivalent_base_quantity, projected_delta_usd, reduce_only, environment, state, payload_hash, error_code, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        venue: { type: string, enum: [BINANCE, BYBIT, OKX] }
        venue_account_id: { type: string, format: uuid }
        client_order_id: { type: string }
        venue_order_id: { type: [string, "null"] }
        symbol: { type: string }
        product: { type: string, enum: [SPOT, LINEAR_PERPETUAL] }
        side: { type: string, enum: [BUY, SELL] }
        base_quantity: { type: string }
        limit_price: { type: string }
        native_quantity: { type: string }
        native_price: { type: string }
        equivalent_base_quantity: { type: string }
        projected_delta_usd: { type: string }
        reduce_only: { type: boolean }
        environment: { type: string, enum: [PRODUCTION, TESTNET, DEMO] }
        state: { type: string }
        payload_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        error_code: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ReconciliationRun:
      type: object
      additionalProperties: false
      required: [id, venue, venue_account_id, status, started_at, completed_at, balances_seen, positions_seen, open_orders_seen, fills_seen, discrepancies]
      properties:
        id: { type: string, format: uuid }
        venue: { type: string, enum: [BINANCE, BYBIT, OKX] }
        venue_account_id: { type: string, format: uuid }
        status: { type: string }
        started_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        balances_seen: { type: integer, minimum: 0 }
        positions_seen: { type: integer, minimum: 0 }
        open_orders_seen: { type: integer, minimum: 0 }
        fills_seen: { type: integer, minimum: 0 }
        discrepancies: { type: integer, minimum: 0 }
    ExactBalance:
      type: object
      additionalProperties: false
      required: [asset, total, available, locked, received_at]
      properties:
        asset: { type: string }
        total: { type: string }
        available: { type: string }
        locked: { type: string }
        received_at: { type: string, format: date-time }
    ExactVenuePosition:
      type: object
      additionalProperties: false
      required: [symbol, product, quantity, entry_price, mark_price, leverage, liquidation_price, received_at]
      properties:
        symbol: { type: string }
        product: { type: string, enum: [SPOT, LINEAR_PERPETUAL] }
        quantity: { type: string }
        entry_price: { type: string }
        mark_price: { type: string }
        leverage: { type: string }
        liquidation_price: { type: [string, "null"] }
        received_at: { type: string, format: date-time }
    ConnectorAccounting:
      type: object
      additionalProperties: false
      required: [venue_account_id, run_id, balances, positions]
      properties:
        venue_account_id: { type: string, format: uuid }
        run_id: { type: [string, "null"], format: uuid }
        balances: { type: array, items: { $ref: "#/components/schemas/ExactBalance" } }
        positions: { type: array, items: { $ref: "#/components/schemas/ExactVenuePosition" } }
    SocialProvider:
      type: string
      enum: [APPLE, GOOGLE]
    AuthNextState:
      type: string
      enum: [PENDING_APPROVAL, MFA_REQUIRED, MFA_ENROLLMENT_REQUIRED, AUTHENTICATED]
    UserStatus:
      type: string
      enum: [PENDING, ACTIVE, SUSPENDED, DELETED]
    Role:
      type: string
      enum: [VIEWER, OWNER, TRADER, APPROVER]
    Venue:
      type: string
      enum: [BINANCE, BYBIT, OKX, DYDX, HYPERLIQUID]
    RouteType:
      type: string
      enum: [SPOT_PERP, PERP_PERP]
    FundingDirection:
      type: string
      enum: [POSITIVE, NEGATIVE]
    DecimalString:
      type: string
      pattern: '^-?(0|[1-9][0-9]*)(\.[0-9]+)?$'
      description: Canonical base-10 decimal; never converted through IEEE-754.
    OpportunityLeg:
      type: object
      additionalProperties: false
      required: [venue, predicted_rate, p10_rate, p90_rate, direction_probability, next_funding_at]
      properties:
        venue: { $ref: "#/components/schemas/Venue" }
        predicted_rate: { $ref: "#/components/schemas/DecimalString" }
        p10_rate: { $ref: "#/components/schemas/DecimalString" }
        p90_rate: { $ref: "#/components/schemas/DecimalString" }
        direction_probability: { $ref: "#/components/schemas/DecimalString" }
        next_funding_at: { type: string, format: date-time }
    RiskLimits:
      type: object
      additionalProperties: false
      required:
        - reference_equity
        - max_portfolio_fraction
        - max_opportunity_fraction
        - max_underlying_fraction
        - max_venue_fraction
        - max_leverage
        - min_profitability
        - min_net_apr
        - max_entry_basis_bps
        - min_depth_multiple
        - max_unmatched_usd
        - max_daily_loss_fraction
        - max_drawdown_fraction
      properties:
        reference_equity: { $ref: "#/components/schemas/DecimalString" }
        max_portfolio_fraction: { $ref: "#/components/schemas/DecimalString" }
        max_opportunity_fraction: { $ref: "#/components/schemas/DecimalString" }
        max_underlying_fraction: { $ref: "#/components/schemas/DecimalString" }
        max_venue_fraction: { $ref: "#/components/schemas/DecimalString" }
        max_leverage: { $ref: "#/components/schemas/DecimalString" }
        min_profitability: { $ref: "#/components/schemas/DecimalString" }
        min_net_apr: { $ref: "#/components/schemas/DecimalString" }
        max_entry_basis_bps: { $ref: "#/components/schemas/DecimalString" }
        min_depth_multiple: { $ref: "#/components/schemas/DecimalString" }
        max_unmatched_usd: { $ref: "#/components/schemas/DecimalString" }
        max_daily_loss_fraction: { $ref: "#/components/schemas/DecimalString" }
        max_drawdown_fraction: { $ref: "#/components/schemas/DecimalString" }
    Opportunity:
      type: object
      additionalProperties: false
      required:
        - route_id
        - route_type
        - underlying
        - funding_direction
        - long_venue
        - short_venue
        - gross_funding_apr
        - entry_cost
        - exit_cost
        - carry_cost
        - risk_buffer
        - break_even_funding
        - net_apr
        - expected_net_pnl
        - profitability_probability
        - entry_basis_bps
        - leverage
        - required_capital
        - available_capacity
        - reserved_notional
        - reserved_capital
        - capital_fraction
        - within_limits
        - long_leg
        - short_leg
        - next_funding_at
      properties:
        route_id: { type: string }
        route_type: { $ref: "#/components/schemas/RouteType" }
        underlying: { type: string }
        funding_direction: { $ref: "#/components/schemas/FundingDirection" }
        long_venue: { $ref: "#/components/schemas/Venue" }
        short_venue: { $ref: "#/components/schemas/Venue" }
        gross_funding_apr: { $ref: "#/components/schemas/DecimalString" }
        entry_cost: { $ref: "#/components/schemas/DecimalString" }
        exit_cost: { $ref: "#/components/schemas/DecimalString" }
        carry_cost: { $ref: "#/components/schemas/DecimalString" }
        risk_buffer: { $ref: "#/components/schemas/DecimalString" }
        break_even_funding: { $ref: "#/components/schemas/DecimalString" }
        net_apr: { $ref: "#/components/schemas/DecimalString" }
        expected_net_pnl: { $ref: "#/components/schemas/DecimalString" }
        profitability_probability: { $ref: "#/components/schemas/DecimalString" }
        entry_basis_bps: { $ref: "#/components/schemas/DecimalString" }
        leverage: { $ref: "#/components/schemas/DecimalString" }
        required_capital: { $ref: "#/components/schemas/DecimalString" }
        available_capacity: { $ref: "#/components/schemas/DecimalString" }
        reserved_notional: { $ref: "#/components/schemas/DecimalString" }
        reserved_capital: { $ref: "#/components/schemas/DecimalString" }
        capital_fraction: { $ref: "#/components/schemas/DecimalString" }
        within_limits: { type: boolean }
        long_leg: { $ref: "#/components/schemas/OpportunityLeg" }
        short_leg: { $ref: "#/components/schemas/OpportunityLeg" }
        next_funding_at: { type: string, format: date-time }
    OpportunityScan:
      type: object
      additionalProperties: false
      required: [scanned_at, model_version, opportunities]
      properties:
        scanned_at:
          type: string
          description: RFC 3339 scan timestamp, or empty when no scan has run yet.
        model_version: { type: string }
        opportunities:
          type: array
          items: { $ref: "#/components/schemas/Opportunity" }
    PositionState:
      type: string
      enum: [QUALIFIED, RESERVED, OPENING, OPEN, OPEN_FAILED, RECOVERING, REHEDGING, CLOSING, CLOSED]
    ExitReason:
      type: string
      enum: [FUNDING_FLIP, THRESHOLD_BREACH, VENUE_UNHEALTHY, MANUAL, RECOVERY_FAILURE, CIRCUIT_BREAKER]
    FillOutcome:
      type: object
      additionalProperties: false
      required: [outcome]
      properties:
        outcome: { type: string, enum: [FULL, PARTIAL, UNKNOWN] }
        fraction: { $ref: "#/components/schemas/DecimalString" }
        reconciled_fraction: { $ref: "#/components/schemas/DecimalString" }
    PaperFillScenario:
      type: object
      additionalProperties: false
      required: [long, short]
      properties:
        long: { $ref: "#/components/schemas/FillOutcome" }
        short: { $ref: "#/components/schemas/FillOutcome" }
    OpenPositionRequest:
      type: object
      additionalProperties: false
      required: [route_id]
      properties:
        route_id: { type: string }
        notional:
          $ref: "#/components/schemas/DecimalString"
          description: Notional (USD) to size each leg to; defaults to the reservation.
        fill_scenario:
          $ref: "#/components/schemas/PaperFillScenario"
    BreakerScope:
      type: string
      enum: [GLOBAL, VENUE, STRATEGY]
    BreakerAction:
      type: string
      enum: [HALT_NEW_RISK, DISABLE_VENUE, READ_ONLY, FLATTEN]
    CircuitBreaker:
      type: object
      additionalProperties: false
      required: [id, scope, action, source, reason, active, created_at]
      properties:
        id: { type: string, format: uuid }
        scope: { $ref: "#/components/schemas/BreakerScope" }
        scope_key: { type: [string, "null"] }
        action: { $ref: "#/components/schemas/BreakerAction" }
        source: { type: string }
        reason: { type: string }
        created_by: { type: [string, "null"] }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
        resolved_at: { type: [string, "null"], format: date-time }
    Controls:
      type: object
      additionalProperties: false
      required: [effective_action, breakers]
      properties:
        effective_action:
          anyOf:
            - { $ref: "#/components/schemas/BreakerAction" }
            - { type: "null" }
        breakers:
          type: array
          items: { $ref: "#/components/schemas/CircuitBreaker" }
    HaltRequest:
      type: object
      additionalProperties: false
      properties:
        action: { type: string, enum: [HALT_NEW_RISK, READ_ONLY], default: HALT_NEW_RISK }
        reason: { type: string }
    ControlReasonRequest:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string }
    PaperOrder:
      type: object
      additionalProperties: false
      required: [client_order_id, side, target_qty, price_cap, time_in_force]
      properties:
        client_order_id: { type: string }
        side: { type: string, enum: [BUY, SELL] }
        target_qty: { $ref: "#/components/schemas/DecimalString" }
        price_cap: { $ref: "#/components/schemas/DecimalString" }
        time_in_force: { type: string }
    PaperFill:
      type: object
      additionalProperties: false
      required: [client_order_id, qty, price, fee]
      properties:
        client_order_id: { type: string }
        qty: { $ref: "#/components/schemas/DecimalString" }
        price: { $ref: "#/components/schemas/DecimalString" }
        fee: { $ref: "#/components/schemas/DecimalString" }
    PositionLeg:
      type: object
      additionalProperties: false
      required:
        - venue
        - symbol
        - is_long
        - mark_price
        - funding_rate
        - funding_interval_hours
        - target_qty
        - filled_qty
        - avg_fill_price
        - fees
        - orders
        - fills
      properties:
        venue: { $ref: "#/components/schemas/Venue" }
        symbol: { type: string }
        is_long: { type: boolean }
        mark_price: { $ref: "#/components/schemas/DecimalString" }
        funding_rate: { $ref: "#/components/schemas/DecimalString" }
        funding_interval_hours: { type: integer, minimum: 1 }
        target_qty: { $ref: "#/components/schemas/DecimalString" }
        filled_qty: { $ref: "#/components/schemas/DecimalString" }
        avg_fill_price: { $ref: "#/components/schemas/DecimalString" }
        fees: { $ref: "#/components/schemas/DecimalString" }
        orders:
          type: array
          items: { $ref: "#/components/schemas/PaperOrder" }
        fills:
          type: array
          items: { $ref: "#/components/schemas/PaperFill" }
    PortfolioAllocation:
      type: object
      required: [key, deployed_capital, fraction]
      properties:
        key: { type: string }
        deployed_capital: { $ref: "#/components/schemas/DecimalString" }
        fraction: { $ref: "#/components/schemas/DecimalString" }
    PnlBreakdown:
      type: object
      required: [realized_funding, realized_trading, unrealized_leg, fees, net, return_on_deployed_capital]
      properties:
        realized_funding: { $ref: "#/components/schemas/DecimalString" }
        realized_trading: { $ref: "#/components/schemas/DecimalString" }
        unrealized_leg: { $ref: "#/components/schemas/DecimalString" }
        fees: { $ref: "#/components/schemas/DecimalString" }
        net: { $ref: "#/components/schemas/DecimalString" }
        return_on_deployed_capital: { $ref: "#/components/schemas/DecimalString" }
    Portfolio:
      type: object
      required: [equity, deployable_equity, deployed_capital, by_venue, by_underlying, pnl, as_of]
      properties:
        equity: { $ref: "#/components/schemas/DecimalString" }
        deployable_equity: { $ref: "#/components/schemas/DecimalString" }
        deployed_capital: { $ref: "#/components/schemas/DecimalString" }
        by_venue: { type: array, items: { $ref: "#/components/schemas/PortfolioAllocation" } }
        by_underlying: { type: array, items: { $ref: "#/components/schemas/PortfolioAllocation" } }
        pnl: { $ref: "#/components/schemas/PnlBreakdown" }
        as_of: { type: string, format: date-time }
    VenueHealth:
      type: object
      required: [venue, status, connected, market_data_age_seconds, clock_drift_ms]
      properties:
        venue: { $ref: "#/components/schemas/Venue" }
        status: { type: string, enum: [HEALTHY, DEGRADED] }
        connected: { type: boolean }
        market_data_age_seconds: { type: integer }
        clock_drift_ms: { type: integer }
    ServiceHeartbeat:
      type: object
      required: [service, status, observed_at]
      properties:
        service: { type: string }
        status: { type: string }
        observed_at: { type: string, format: date-time }
    SystemHealth:
      type: object
      required: [venues, services, as_of]
      properties:
        venues: { type: array, items: { $ref: "#/components/schemas/VenueHealth" } }
        services: { type: array, items: { $ref: "#/components/schemas/ServiceHeartbeat" } }
        as_of: { type: string, format: date-time }
    Alert:
      type: object
      required: [id, dedup_key, severity, title, message, created_at, acknowledged_at, acknowledged_by]
      properties:
        id: { type: string, format: uuid }
        dedup_key: { type: string }
        severity: { type: string, enum: [INFORMATIONAL, WARNING, CRITICAL] }
        title: { type: string }
        message: { type: string }
        created_at: { type: string, format: date-time }
        acknowledged_at: { type: [string, "null"], format: date-time }
        acknowledged_by: { type: [string, "null"], format: uuid }
    StrategyAllocation:
      type: object
      additionalProperties: false
      required: [method]
      properties:
        method: { type: string, enum: [FIXED, PERCENT_EQUITY, BOUNDED_DYNAMIC] }
        value: { $ref: "#/components/schemas/DecimalString" }
        minimum: { $ref: "#/components/schemas/DecimalString" }
        maximum: { $ref: "#/components/schemas/DecimalString" }
    AutoCompoundPolicy:
      type: object
      additionalProperties: false
      required: [enabled, reinvest_fraction, minimum_reinvest_amount]
      properties:
        enabled: { type: boolean }
        reinvest_fraction: { $ref: "#/components/schemas/DecimalString" }
        minimum_reinvest_amount: { $ref: "#/components/schemas/DecimalString" }
    StrategyVersion:
      type: object
      additionalProperties: false
      required: [version, creator, created_at, mode, route_types, allowed_venues, allowed_assets, min_net_apr, min_profitability, min_forecast_coverage, max_time_to_funding_minutes, max_basis_bps, allocation, max_concurrent, cooldown_seconds, hold_seconds, auto_compound, exit_net_apr, max_drawdown_fraction]
      properties:
        version: { type: integer, minimum: 1 }
        creator: { type: string }
        created_at: { type: string, format: date-time }
        mode: { type: string, enum: [PAPER] }
        route_types: { type: array, items: { $ref: "#/components/schemas/RouteType" } }
        allowed_venues: { type: array, items: { $ref: "#/components/schemas/Venue" } }
        allowed_assets: { type: array, items: { type: string } }
        min_net_apr: { $ref: "#/components/schemas/DecimalString" }
        min_profitability: { $ref: "#/components/schemas/DecimalString" }
        min_forecast_coverage: { $ref: "#/components/schemas/DecimalString" }
        max_time_to_funding_minutes: { type: integer, minimum: 0 }
        max_basis_bps: { $ref: "#/components/schemas/DecimalString" }
        allocation: { $ref: "#/components/schemas/StrategyAllocation" }
        max_concurrent: { type: integer, minimum: 1 }
        cooldown_seconds: { type: integer, minimum: 0 }
        hold_seconds: { type: integer, minimum: 0 }
        auto_compound: { $ref: "#/components/schemas/AutoCompoundPolicy" }
        exit_net_apr: { $ref: "#/components/schemas/DecimalString" }
        take_profit_fraction: { $ref: "#/components/schemas/DecimalString" }
        stop_loss_fraction: { $ref: "#/components/schemas/DecimalString" }
        max_drawdown_fraction: { $ref: "#/components/schemas/DecimalString" }
    Strategy:
      type: object
      additionalProperties: false
      required: [id, name, enabled, current]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        enabled: { type: boolean }
        current: { $ref: "#/components/schemas/StrategyVersion" }
    Position:
      type: object
      additionalProperties: false
      required:
        - id
        - route_id
        - strategy_id
        - underlying
        - route_type
        - funding_direction
        - state
        - target_notional
        - reserved_capital
        - residual_delta_usd
        - residual_breach_ticks
        - exit_reason
        - funding_captured
        - realized_pnl
        - opened_at
        - long_leg
        - short_leg
      properties:
        id: { type: string, format: uuid }
        route_id: { type: string }
        strategy_id: { type: [string, "null"], format: uuid }
        underlying: { type: string }
        route_type: { $ref: "#/components/schemas/RouteType" }
        funding_direction: { $ref: "#/components/schemas/FundingDirection" }
        state: { $ref: "#/components/schemas/PositionState" }
        target_notional: { $ref: "#/components/schemas/DecimalString" }
        reserved_capital: { $ref: "#/components/schemas/DecimalString" }
        residual_delta_usd: { $ref: "#/components/schemas/DecimalString" }
        residual_breach_ticks: { type: integer, minimum: 0 }
        exit_reason:
          anyOf:
            - { $ref: "#/components/schemas/ExitReason" }
            - { type: "null" }
        funding_captured: { $ref: "#/components/schemas/DecimalString" }
        realized_pnl: { $ref: "#/components/schemas/DecimalString" }
        opened_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time }
        long_leg: { $ref: "#/components/schemas/PositionLeg" }
        short_leg: { $ref: "#/components/schemas/PositionLeg" }
    PositionList:
      type: object
      additionalProperties: false
      required: [positions]
      properties:
        positions:
          type: array
          items: { $ref: "#/components/schemas/Position" }
    CreateSocialChallengeRequest:
      type: object
      additionalProperties: false
      required: [provider, redirect_uri, code_challenge, purpose]
      properties:
        provider: { $ref: "#/components/schemas/SocialProvider" }
        purpose: { type: string, enum: [SIGN_IN, LINK_IDENTITY] }
        redirect_uri: { type: string, format: uri }
        code_challenge: { type: string, minLength: 43, maxLength: 128 }
    SocialChallenge:
      type: object
      additionalProperties: false
      required: [id, provider, state, nonce, expires_at]
      properties:
        id: { type: string, format: uuid }
        provider: { $ref: "#/components/schemas/SocialProvider" }
        state: { type: string, minLength: 32 }
        nonce: { type: string, minLength: 32 }
        expires_at: { type: string, format: date-time }
    SocialExchangeRequest:
      type: object
      additionalProperties: false
      required: [challenge_id, authorization_code, identity_token, code_verifier, device]
      properties:
        challenge_id: { type: string, format: uuid }
        authorization_code: { type: string, writeOnly: true }
        identity_token: { type: string, writeOnly: true }
        code_verifier: { type: string, minLength: 43, maxLength: 128, writeOnly: true }
        apple_profile:
          type: object
          additionalProperties: false
          properties:
            display_name: { type: string, maxLength: 200 }
        device: { $ref: "#/components/schemas/DeviceRegistration" }
    DeviceRegistration:
      type: object
      additionalProperties: false
      required: [installation_id, platform, app_version, display_name]
      properties:
        installation_id: { type: string, minLength: 16, writeOnly: true }
        platform: { const: IOS }
        app_version: { type: string }
        display_name: { type: string, maxLength: 100 }
    AuthTransition:
      type: object
      additionalProperties: false
      required: [next, user]
      properties:
        next: { $ref: "#/components/schemas/AuthNextState" }
        user: { $ref: "#/components/schemas/CurrentUser" }
        challenge_token: { type: string, writeOnly: true }
        session: { $ref: "#/components/schemas/SessionCredentials" }
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, tenant, status, roles, linked_providers, mfa_enrolled]
      properties:
        id: { type: string, format: uuid }
        tenant: { $ref: "#/components/schemas/TenantSummary" }
        status: { $ref: "#/components/schemas/UserStatus" }
        display_name: { type: [string, "null"] }
        email: { type: [string, "null"], format: email }
        roles:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/Role" }
        linked_providers:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/SocialProvider" }
        mfa_enrolled: { type: boolean }
    TenantSummary:
      type: object
      additionalProperties: false
      required: [id, display_name, base_currency, state]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string, minLength: 1, maxLength: 120 }
        base_currency: { type: string, const: USD }
        state:
          type: string
          enum: [PAPER_ONLY, PILOT_ELIGIBLE, PILOT_ARMED, SUSPENDED, DELETED]
    MfaEnrollment:
      type: object
      additionalProperties: false
      required: [method_id, secret, otpauth_uri]
      properties:
        method_id: { type: string, format: uuid }
        secret: { type: string, writeOnly: true }
        otpauth_uri: { type: string, writeOnly: true }
    MfaCodeRequest:
      type: object
      additionalProperties: false
      required: [challenge_token, code]
      properties:
        challenge_token: { type: string, writeOnly: true }
        code: { type: string, minLength: 6, maxLength: 64, writeOnly: true }
        recovery_code: { type: boolean, default: false }
        recovery_codes_acknowledged: { type: boolean, default: false }
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token, device_id]
      properties:
        refresh_token: { type: string, minLength: 43, writeOnly: true }
        device_id: { type: string, format: uuid }
    SessionCredentials:
      type: object
      additionalProperties: false
      required: [access_token, access_token_expires_at, refresh_token, session_id, device_id]
      properties:
        access_token: { type: string, writeOnly: true }
        access_token_expires_at: { type: string, format: date-time }
        refresh_token: { type: string, writeOnly: true }
        session_id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
    Session:
      type: object
      additionalProperties: false
      required: [id, device_id, device_name, current, created_at, last_seen_at]
      properties:
        id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        device_name: { type: string }
        current: { type: boolean }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
    LinkedIdentity:
      type: object
      additionalProperties: false
      required: [provider, linked_at, last_authenticated_at]
      properties:
        provider: { $ref: "#/components/schemas/SocialProvider" }
        profile_email: { type: [string, "null"], format: email }
        linked_at: { type: string, format: date-time }
        last_authenticated_at: { type: string, format: date-time }
    AccessRequest:
      type: object
      additionalProperties: false
      required: [user_id, provider, requested_at]
      properties:
        user_id: { type: string, format: uuid }
        provider: { $ref: "#/components/schemas/SocialProvider" }
        display_name: { type: [string, "null"] }
        email: { type: [string, "null"], format: email }
        requested_at: { type: string, format: date-time }
    AuditEntry:
      type: object
      additionalProperties: false
      required: [occurred_at, event_type, subject_type, subject_id, actor, details, event_hash]
      properties:
        occurred_at: { type: string, format: date-time }
        event_type: { type: string }
        subject_type: { type: string }
        subject_id: { type: string }
        actor: { type: string, format: uuid, description: Pseudonymized actor identifier. }
        details: { type: object, additionalProperties: true }
        event_hash: { type: string, description: Lowercase hex of the chained event hash. }
    AuditLog:
      type: object
      additionalProperties: false
      required: [intact, events]
      properties:
        intact: { type: boolean, description: Whether the hash chain verifies end to end. }
        events:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
    Passkey:
      type: object
      additionalProperties: false
      required: [id, label, created_at]
      properties:
        id: { type: string, format: uuid }
        label: { type: string, minLength: 1, maxLength: 120 }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
    PasskeyCeremonyChallenge:
      type: object
      additionalProperties: false
      required: [challenge_id, options]
      properties:
        challenge_id: { type: string, format: uuid }
        options:
          type: object
          description: Opaque WebAuthn PublicKeyCredentialCreationOptions or RequestOptions.
          additionalProperties: true
    PasskeyAssertionOutcome:
      type: object
      additionalProperties: false
      required: [verified, credential_id]
      properties:
        verified: { type: boolean }
        credential_id: { type: string, description: Hex-encoded credential id. }
    CredentialSecret:
      type: object
      description: Write-only exchange API credential. Never returned by any endpoint.
      additionalProperties: false
      required: [api_key, api_secret]
      properties:
        api_key: { type: string, writeOnly: true }
        api_secret: { type: string, writeOnly: true }
        passphrase: { type: [string, "null"], writeOnly: true }
    CredentialEnrollStart:
      type: object
      additionalProperties: false
      required: [venue, alias, product, environment]
      properties:
        venue: { $ref: "#/components/schemas/Venue" }
        alias: { type: string, minLength: 1, maxLength: 120 }
        product: { type: string }
        environment: { type: string }
    CredentialEnrollFinish:
      type: object
      additionalProperties: false
      required: [challenge_id, venue, alias, product, environment, assertion, credential]
      properties:
        challenge_id: { type: string, format: uuid }
        venue: { $ref: "#/components/schemas/Venue" }
        alias: { type: string, minLength: 1, maxLength: 120 }
        product: { type: string }
        environment: { type: string }
        assertion:
          type: object
          description: Opaque WebAuthn PublicKeyCredential authorizing the enrollment.
          additionalProperties: true
        credential: { $ref: "#/components/schemas/CredentialSecret" }
    CredentialProduct:
      type: object
      additionalProperties: false
      required: [product]
      properties:
        product: { type: string }
    PilotState:
      type: string
      enum: [PAPER_ONLY, PILOT_ELIGIBLE, PILOT_ARMED, SUSPENDED, DELETED]
    EligibleRoute:
      type: object
      additionalProperties: false
      required: [venue_account_id, alias, product]
      properties:
        venue_account_id: { type: string, format: uuid }
        alias: { type: string }
        product: { type: string }
    PilotStatus:
      type: object
      additionalProperties: false
      required: [state, eligible]
      properties:
        state: { $ref: "#/components/schemas/PilotState" }
        eligible:
          type: array
          items: { $ref: "#/components/schemas/EligibleRoute" }
    PilotRoute:
      type: object
      additionalProperties: false
      required: [venue_account_id, product]
      properties:
        venue_account_id: { type: string, format: uuid }
        product: { type: string }
    PilotArmFinish:
      type: object
      additionalProperties: false
      required: [challenge_id, venue_account_id, product, assertion, confirmation]
      properties:
        challenge_id: { type: string, format: uuid }
        venue_account_id: { type: string, format: uuid }
        product: { type: string }
        assertion:
          type: object
          description: Opaque WebAuthn PublicKeyCredential authorizing the arm.
          additionalProperties: true
        confirmation: { type: string, description: Must equal the account alias. }
    CertificationState:
      type: string
      enum: [DISABLED, PAPER_ONLY, SHADOW, PILOT, CERTIFIED_LIVE]
    CertifyTarget:
      type: object
      additionalProperties: false
      required: [target]
      properties:
        target: { $ref: "#/components/schemas/CertificationState" }
    CertifyFinish:
      type: object
      additionalProperties: false
      required: [challenge_id, target, assertion]
      properties:
        challenge_id: { type: string, format: uuid }
        target: { $ref: "#/components/schemas/CertificationState" }
        assertion:
          type: object
          description: Opaque WebAuthn PublicKeyCredential authorizing the promotion.
          additionalProperties: true
    PreflightReconciliation:
      type: object
      additionalProperties: false
      required: [status, balances_seen, positions_seen, open_orders_seen, discrepancies]
      properties:
        status: { type: string }
        balances_seen: { type: integer, minimum: 0 }
        positions_seen: { type: integer, minimum: 0 }
        open_orders_seen: { type: integer, minimum: 0 }
        discrepancies: { type: integer, minimum: 0 }
    PreflightReport:
      type: object
      additionalProperties: false
      required: [account_id, product, status, checks]
      properties:
        account_id: { type: string, format: uuid }
        product: { type: string }
        status: { type: string, description: Resulting connection status (ELIGIBLE or PREFLIGHT_FAILED). }
        checks: { type: array, items: { type: string } }
        reconciliation:
          anyOf:
            - { $ref: "#/components/schemas/PreflightReconciliation" }
            - { type: "null" }
    CredentialRotateFinish:
      type: object
      additionalProperties: false
      required: [challenge_id, product, assertion, credential]
      properties:
        challenge_id: { type: string, format: uuid }
        product: { type: string }
        assertion:
          type: object
          description: Opaque WebAuthn PublicKeyCredential authorizing the rotation.
          additionalProperties: true
        credential: { $ref: "#/components/schemas/CredentialSecret" }
    CredentialRevokeFinish:
      type: object
      additionalProperties: false
      required: [challenge_id, product, assertion]
      properties:
        challenge_id: { type: string, format: uuid }
        product: { type: string }
        assertion:
          type: object
          description: Opaque WebAuthn PublicKeyCredential authorizing the revocation.
          additionalProperties: true
    CredentialDeleteFinish:
      type: object
      additionalProperties: false
      required: [challenge_id, assertion]
      properties:
        challenge_id: { type: string, format: uuid }
        assertion:
          type: object
          description: Opaque WebAuthn PublicKeyCredential authorizing the deletion.
          additionalProperties: true
    StepUpRequest:
      type: object
      additionalProperties: false
      required: [action, totp_code]
      properties:
        action: { type: string, minLength: 1 }
        resource_id: { type: string }
        resource_version: { type: integer, minimum: 1 }
        command_digest: { type: string, pattern: "^[a-f0-9]{64}$" }
        totp_code: { type: string, pattern: "^[0-9]{6}$", writeOnly: true }
    StepUpProof:
      type: object
      additionalProperties: false
      required: [proof, expires_at]
      properties:
        proof: { type: string, writeOnly: true }
        expires_at: { type: string, format: date-time }
    Health:
      type: object
      additionalProperties: false
      required: [status, mode, stage]
      properties:
        status: { const: OK }
        mode: { const: PAPER }
        stage: { enum: [M0_SCAFFOLD, M1_AUTH] }
    EntryReadiness:
      type: object
      additionalProperties: false
      required: [status, reasons]
      properties:
        status: { const: BLOCKED }
        reasons:
          type: array
          items: { type: string }
    Problem:
      type: object
      description: RFC 9457 problem details with a stable Perpeto code and correlation request ID.
      additionalProperties: false
      required: [type, title, status, code, request_id]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { type: string }
        request_id: { type: string, format: uuid }
        instance: { type: string, format: uri-reference }
