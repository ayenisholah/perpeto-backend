      responses:
        "200": { description: Masked account detail., content: { application/json: { schema: { $ref: "#/components/schemas/VenueAccount" } } } }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "404": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/venue-accounts/{id}/test:
    post:
      tags: [Venues]
      summary: Validate account configuration without submitting orders
      operationId: testVenueAccount
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Configuration safety result., content: { application/json: { schema: { $ref: "#/components/schemas/ConnectionTest" } } } }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
        "404": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/venue-accounts/{id}/accounting:
    get:
      tags: [Venues]
      summary: Get the latest reconciled exact balance and position snapshot
      operationId: getConnectorAccounting
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Latest exact accounting snapshot., content: { application/json: { schema: { $ref: "#/components/schemas/ConnectorAccounting" } } } }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "404": { $ref: "#/components/responses/ProblemResponse" }
