openapi: 3.1.0
info:
  title: Perpeto Control API
  version: 0.22.0
  description: >-
    Social identity, MFA, and secure sessions plus the M2 deterministic paper
    scanner and coordinated simulated positions. Live execution remains unavailable.
  license:
    name: Proprietary
    url: https://github.com/ayenisholah/perpeto-backend#license
servers:
  - url: https://{host}
    description: Owner-managed Perpeto deployment
    variables:
      host:
        default: staging.perpeto.invalid
security:
  - bearerAuth: []
tags:
  - name: Health
    description: Public process, dependency, and paper-entry readiness probes.
  - name: Social authentication
    description: One-use Apple and Google authorization challenges and server-side proof exchange.
  - name: MFA
    description: Perpeto TOTP enrollment, recovery-code acknowledgement, verification, and privileged step-up.
  - name: Sessions
    description: Memory access tokens and rotating, device-bound refresh-session lifecycle.
  - name: Identities
    description: Explicit provider linking and unlinking; email never merges accounts.
  - name: Access requests
    description: Owner review of isolated pending social registrations.
  - name: Account
    description: Current-user status and privacy-preserving account deletion.
  - name: Opportunities
    description: Read-only ranked funding-arbitrage opportunities from the deterministic paper scanner.
  - name: Positions
    description: Opening and monitoring coordinated paper arbitrage positions (no live trading).
  - name: Controls
    description: Durable paper circuit breakers and emergency controls.
  - name: Strategies
    description: Versioned automated paper-strategy configuration.
  - name: Monitoring
    description: Paper portfolio, service health, and deduplicated alerts.
  - name: Venues
    description: Masked centralized-exchange accounts and connector capabilities.
  - name: Provider notifications
    description: Signed, idempotent identity-provider account-change callbacks.
paths:
  /livez:
    get:
      tags: [Health]
      security: []
      summary: Check process liveness
      operationId: getLiveness
      responses:
        "200": { $ref: "#/components/responses/HealthResponse" }
        "429": { $ref: "#/components/responses/ProblemResponse" }
  /readyz:
    get:
      tags: [Health]
      security: []
      summary: Check core service readiness
      operationId: getReadiness
      responses:
        "200": { $ref: "#/components/responses/HealthResponse" }
        "429": { $ref: "#/components/responses/ProblemResponse" }
  /entryz:
    get:
      tags: [Health]
      security: []
      summary: Check trading entry readiness
      operationId: getEntryReadiness
      responses:
        "200":
          description: Entry readiness was evaluated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntryReadiness" }
        "429": { $ref: "#/components/responses/ProblemResponse" }
        "503":
          description: Trading entry remains blocked during M1A.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntryReadiness" }
  /api/v1/auth/social/challenges:
    post:
      tags: [Social authentication]
      security: []
      summary: Create a short-lived one-use social authorization challenge
      operationId: createSocialChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSocialChallengeRequest" }
      responses:
        "201":
          description: Challenge created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialChallenge" }
        "400": { $ref: "#/components/responses/ProblemResponse" }
        "429": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/auth/social/exchange:
    post:
      tags: [Social authentication]
      security: []
      summary: Verify a provider response and return exactly one authentication next state
      operationId: exchangeSocialAuthorization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SocialExchangeRequest" }
      responses:
        "200":
          description: Provider proof accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTransition" }
        "400": { $ref: "#/components/responses/ProblemResponse" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "409": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/auth/bootstrap:
    post:
      tags: [Account]
      summary: Consume the one-use deployment token for the first socially authenticated Owner
      operationId: bootstrapFirstOwner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [deployment_token]
              properties:
                deployment_token: { type: string, minLength: 32, writeOnly: true }
      responses:
        "200":
          description: Owner role assigned; MFA enrollment is required.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTransition" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "409": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/auth/mfa/enroll:
    post:
      tags: [MFA]
      summary: Begin TOTP enrollment
      operationId: enrollMfa
      responses:
        "201":
          description: Enrollment secret and URI returned once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MfaEnrollment" }
        "409": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/auth/mfa/confirm:
    post:
      tags: [MFA]
      summary: Confirm TOTP enrollment and issue recovery codes once
      operationId: confirmMfa
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaCodeRequest" }
      responses:
        "200":
          description: Enrollment confirmed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [recovery_codes]
                properties:
                  recovery_codes:
                    type: array
                    minItems: 8
                    items: { type: string }
        "401": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/auth/mfa/verify:
    post:
      tags: [MFA]
      summary: Complete a TOTP or one-use recovery-code challenge
      operationId: verifyMfa
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaCodeRequest" }
      responses:
        "200":
          description: Session created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionCredentials" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "423": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/auth/mfa/recovery-codes/acknowledge:
    post:
      tags: [MFA]
      summary: Acknowledge that the newly issued recovery-code set was saved
      operationId: acknowledgeRecoveryCodes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge_token, code_set_digest]
              properties:
                challenge_token: { type: string, writeOnly: true }
                code_set_digest:
                  type: string
                  pattern: "^[a-f0-9]{64}$"
                  writeOnly: true
                  description: Lowercase SHA-256 hex of the UTF-8 compact JSON recovery-code array in issued order.
      responses:
        "200":
          description: Privileged role activated and session created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionCredentials" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/auth/refresh:
    post:
      tags: [Sessions]
      security: []
      summary: Rotate a device-bound refresh token once
      operationId: refreshSession
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: Token rotated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionCredentials" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "409": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/auth/step-up:
    post:
      tags: [MFA]
      summary: Verify TOTP and issue a five-minute action-bound proof
      operationId: createStepUpProof
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StepUpRequest" }
      responses:
        "201":
          description: Proof issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StepUpProof" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/auth/logout:
    post:
      tags: [Sessions]
      summary: Revoke the current session
      operationId: logout
      responses:
        "204": { description: Session revoked. }
        "401": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/auth/me:
    get:
      tags: [Account]
      summary: Read the caller's minimal identity and authentication status
      operationId: getCurrentUser
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/auth/sessions:
    get:
      tags: [Sessions]
      summary: List the caller's devices and sessions
      operationId: listSessions
      responses:
        "200":
          description: Sessions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/auth/sessions/{session_id}:
    delete:
      tags: [Sessions]
      summary: Revoke one session or device remotely
      operationId: revokeSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204": { description: Session revoked. }
        "404": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/auth/identities:
    get:
      tags: [Identities]
      summary: List linked social identities without exposing provider tokens
      operationId: listSocialIdentities
      responses:
        "200":
          description: Linked identities.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LinkedIdentity" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/auth/identities/link:
    post:
      tags: [Identities]
      summary: Link an identity after fresh provider authentication and privileged TOTP
      operationId: linkSocialIdentity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge_id, authorization_code, identity_token, code_verifier]
              properties:
                challenge_id: { type: string, format: uuid }
                authorization_code: { type: string, writeOnly: true }
                identity_token: { type: string, writeOnly: true }
                code_verifier: { type: string, minLength: 43, maxLength: 128, writeOnly: true }
                totp_code: { type: string, pattern: "^[0-9]{6}$", writeOnly: true }
      responses:
        "201":
          description: Identity linked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkedIdentity" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "409": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/auth/identities/{provider}:
    delete:
      tags: [Identities]
      summary: Unlink a provider unless it is the final identity
      operationId: unlinkSocialIdentity
      parameters:
        - $ref: "#/components/parameters/Provider"
      responses:
        "204": { description: Identity unlinked. }
        "409": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/access-requests:
    get:
      tags: [Access requests]
      summary: List pending social registrations (Owner only)
      operationId: listAccessRequests
      responses:
        "200":
          description: Pending requests.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AccessRequest" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/access-requests/{user_id}/approve:
    post:
      tags: [Access requests]
      summary: Approve a pending account with Viewer access (Owner only)
      operationId: approveAccessRequest
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Viewer access granted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
        "409": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/audit:
    get:
      tags: [Audit]
      summary: Review the tenant's tamper-evident control-plane audit log (Owner only)
      operationId: getAuditLog
      responses:
        "200":
          description: The audit log and its integrity flag.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditLog" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/account:
    delete:
      tags: [Account]
      summary: Delete the current account, erase PII, and revoke provider credentials and sessions
      operationId: deleteAccount
      responses:
        "204": { description: Account deleted and audit actor pseudonymized. }
        "409": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/passkeys:
    get:
      tags: [Passkeys]
      summary: List the caller's registered passkeys
      operationId: listPasskeys
      responses:
        "200":
          description: Registered passkeys.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Passkey" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "503": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/passkeys/register/start:
    post:
      tags: [Passkeys]
      summary: Begin registering a new passkey authenticator
      operationId: startPasskeyRegistration
      responses:
        "200":
          description: WebAuthn credential-creation options.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyCeremonyChallenge" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "503": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/passkeys/register/finish:
    post:
      tags: [Passkeys]
      summary: Complete passkey registration and store the authenticator
      operationId: finishPasskeyRegistration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge_id, label, credential]
              properties:
                challenge_id: { type: string, format: uuid }
                label: { type: string, minLength: 1, maxLength: 120 }
                credential:
                  type: object
                  description: Opaque WebAuthn RegisterPublicKeyCredential from the authenticator.
                  additionalProperties: true
      responses:
        "201":
          description: Passkey registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Passkey" }
        "400": { $ref: "#/components/responses/ProblemResponse" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "409": { $ref: "#/components/responses/ProblemResponse" }
        "503": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/passkeys/authenticate/start:
    post:
      tags: [Passkeys]
      summary: Begin a passkey assertion for the caller
      operationId: startPasskeyAuthentication
      responses:
        "200":
          description: WebAuthn credential-request options.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyCeremonyChallenge" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "404": { $ref: "#/components/responses/ProblemResponse" }
        "503": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/passkeys/authenticate/finish:
    post:
      tags: [Passkeys]
      summary: Complete a passkey assertion
      operationId: finishPasskeyAuthentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge_id, credential]
              properties:
                challenge_id: { type: string, format: uuid }
                credential:
                  type: object
                  description: Opaque WebAuthn PublicKeyCredential from the authenticator.
                  additionalProperties: true
      responses:
        "200":
          description: Assertion verified.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyAssertionOutcome" }
        "400": { $ref: "#/components/responses/ProblemResponse" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "503": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/passkeys/{passkey_id}/revoke:
    post:
      tags: [Passkeys]
      summary: Revoke a registered passkey
      operationId: revokePasskey
      parameters:
        - in: path
          name: passkey_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Passkey revoked. }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "404": { $ref: "#/components/responses/ProblemResponse" }
        "503": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/venue-credentials/enroll/start:
    post:
      tags: [Credentials]
      summary: Begin passkey-authorized enrollment of a new exchange credential
      operationId: startCredentialEnrollment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialEnrollStart" }
      responses:
        "200":
          description: WebAuthn action challenge.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyCeremonyChallenge" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
        "503": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/venue-credentials/enroll/finish:
    post:
      tags: [Credentials]
      summary: Complete enrollment, encrypting the credential and creating the masked account
      operationId: finishCredentialEnrollment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialEnrollFinish" }
      responses:
        "201":
          description: Masked venue account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenueAccount" }
        "400": { $ref: "#/components/responses/ProblemResponse" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
        "409": { $ref: "#/components/responses/ProblemResponse" }
        "503": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/venue-credentials/{account_id}/rotate/start:
    post:
      tags: [Credentials]
      summary: Begin passkey-authorized rotation of a connection credential
      operationId: startCredentialRotation
      parameters:
        - in: path
          name: account_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialProduct" }
      responses:
        "200":
          description: WebAuthn action challenge.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyCeremonyChallenge" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
        "404": { $ref: "#/components/responses/ProblemResponse" }
        "503": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/venue-credentials/{account_id}/rotate/finish:
    post:
      tags: [Credentials]
      summary: Complete a credential rotation and require preflight revalidation
      operationId: finishCredentialRotation
      parameters:
        - in: path
          name: account_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialRotateFinish" }
      responses:
        "200":
          description: Masked venue account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenueAccount" }
        "400": { $ref: "#/components/responses/ProblemResponse" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
        "404": { $ref: "#/components/responses/ProblemResponse" }
        "503": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/venue-credentials/{account_id}/revoke/start:
    post:
      tags: [Credentials]
      summary: Begin passkey-authorized revocation of a connection credential
      operationId: startCredentialRevocation
      parameters:
        - in: path
          name: account_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialProduct" }
      responses:
        "200":
          description: WebAuthn action challenge.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyCeremonyChallenge" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
        "404": { $ref: "#/components/responses/ProblemResponse" }
        "503": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/venue-credentials/{account_id}/revoke/finish:
    post:
      tags: [Credentials]
      summary: Complete a credential revocation, destroying the stored secret
      operationId: finishCredentialRevocation
      parameters:
        - in: path
          name: account_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialRevokeFinish" }
      responses:
        "200":
          description: Masked venue account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenueAccount" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
        "404": { $ref: "#/components/responses/ProblemResponse" }
        "503": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/venue-credentials/{account_id}/delete/start:
    post:
      tags: [Credentials]
      summary: Begin passkey-authorized deletion of a venue account
      operationId: startCredentialDeletion
      parameters:
        - in: path
          name: account_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: WebAuthn action challenge.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyCeremonyChallenge" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
        "404": { $ref: "#/components/responses/ProblemResponse" }
        "503": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/venue-credentials/{account_id}/delete/finish:
    post:
      tags: [Credentials]
      summary: Delete a venue account, destroying every connection secret and tombstoning it
      operationId: finishCredentialDeletion
      parameters:
        - in: path
          name: account_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialDeleteFinish" }
      responses:
        "204":
          description: The account and its secrets were deleted.
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
        "404": { $ref: "#/components/responses/ProblemResponse" }
        "409": { $ref: "#/components/responses/ProblemResponse" }
        "503": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/venue-credentials/{account_id}/certify/start:
    post:
      tags: [Credentials]
      summary: Begin passkey-authorized certification promotion of a route (Owner only)
      operationId: startRouteCertification
      parameters:
        - in: path
          name: account_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CertifyTarget" }
      responses:
        "200":
          description: WebAuthn action challenge.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyCeremonyChallenge" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
        "503": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/venue-credentials/{account_id}/certify/finish:
    post:
      tags: [Credentials]
      summary: Complete a certification promotion (records operator assertion; Owner only)
      operationId: finishRouteCertification
      parameters:
        - in: path
          name: account_id
          required: true
