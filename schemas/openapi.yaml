openapi: 3.1.0
info:
  title: Perpeto Control API
  version: 0.8.0
  description: >-
    Social identity, MFA, and secure sessions plus the M2 deterministic paper
    scanner and coordinated simulated positions. Live execution remains unavailable.
  license:
    name: Proprietary
    url: https://github.com/ayenisholah/perpeto-backend#license
servers:
  - url: https://{host}
    description: Owner-managed Perpeto deployment
    variables:
      host:
        default: staging.perpeto.invalid
security:
  - bearerAuth: []
tags:
  - name: Health
    description: Public process, dependency, and paper-entry readiness probes.
  - name: Social authentication
    description: One-use Apple and Google authorization challenges and server-side proof exchange.
  - name: MFA
    description: Perpeto TOTP enrollment, recovery-code acknowledgement, verification, and privileged step-up.
  - name: Sessions
    description: Memory access tokens and rotating, device-bound refresh-session lifecycle.
  - name: Identities
    description: Explicit provider linking and unlinking; email never merges accounts.
  - name: Access requests
    description: Owner review of isolated pending social registrations.
  - name: Account
    description: Current-user status and privacy-preserving account deletion.
  - name: Opportunities
    description: Read-only ranked funding-arbitrage opportunities from the deterministic paper scanner.
  - name: Positions
    description: Opening and monitoring coordinated paper arbitrage positions (no live trading).
  - name: Controls
    description: Durable paper circuit breakers and emergency controls.
  - name: Provider notifications
    description: Signed, idempotent identity-provider account-change callbacks.
paths:
  /livez:
    get:
      tags: [Health]
      security: []
      summary: Check process liveness
      operationId: getLiveness
      responses:
        "200": { $ref: "#/components/responses/HealthResponse" }
        "429": { $ref: "#/components/responses/ProblemResponse" }
  /readyz:
    get:
      tags: [Health]
      security: []
      summary: Check core service readiness
      operationId: getReadiness
      responses:
        "200": { $ref: "#/components/responses/HealthResponse" }
        "429": { $ref: "#/components/responses/ProblemResponse" }
  /entryz:
    get:
      tags: [Health]
      security: []
      summary: Check trading entry readiness
      operationId: getEntryReadiness
      responses:
        "200":
          description: Entry readiness was evaluated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntryReadiness" }
        "429": { $ref: "#/components/responses/ProblemResponse" }
        "503":
          description: Trading entry remains blocked during M1A.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntryReadiness" }
  /api/v1/auth/social/challenges:
    post:
      tags: [Social authentication]
      security: []
      summary: Create a short-lived one-use social authorization challenge
      operationId: createSocialChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSocialChallengeRequest" }
      responses:
        "201":
          description: Challenge created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialChallenge" }
        "400": { $ref: "#/components/responses/ProblemResponse" }
        "429": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/auth/social/exchange:
    post:
      tags: [Social authentication]
      security: []
      summary: Verify a provider response and return exactly one authentication next state
      operationId: exchangeSocialAuthorization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SocialExchangeRequest" }
      responses:
        "200":
          description: Provider proof accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTransition" }
        "400": { $ref: "#/components/responses/ProblemResponse" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "409": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/auth/bootstrap:
    post:
      tags: [Account]
      summary: Consume the one-use deployment token for the first socially authenticated Owner
      operationId: bootstrapFirstOwner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [deployment_token]
              properties:
                deployment_token: { type: string, minLength: 32, writeOnly: true }
      responses:
        "200":
          description: Owner role assigned; MFA enrollment is required.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTransition" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "409": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/auth/mfa/enroll:
    post:
      tags: [MFA]
      summary: Begin TOTP enrollment
      operationId: enrollMfa
      responses:
        "201":
          description: Enrollment secret and URI returned once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MfaEnrollment" }
        "409": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/auth/mfa/confirm:
    post:
      tags: [MFA]
      summary: Confirm TOTP enrollment and issue recovery codes once
      operationId: confirmMfa
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaCodeRequest" }
      responses:
        "200":
          description: Enrollment confirmed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [recovery_codes]
                properties:
                  recovery_codes:
                    type: array
                    minItems: 8
                    items: { type: string }
        "401": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/auth/mfa/verify:
    post:
      tags: [MFA]
      summary: Complete a TOTP or one-use recovery-code challenge
      operationId: verifyMfa
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaCodeRequest" }
      responses:
        "200":
          description: Session created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionCredentials" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "423": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/auth/mfa/recovery-codes/acknowledge:
    post:
      tags: [MFA]
      summary: Acknowledge that the newly issued recovery-code set was saved
      operationId: acknowledgeRecoveryCodes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge_token, code_set_digest]
              properties:
                challenge_token: { type: string, writeOnly: true }
                code_set_digest:
                  type: string
                  pattern: "^[a-f0-9]{64}$"
                  writeOnly: true
                  description: Lowercase SHA-256 hex of the UTF-8 compact JSON recovery-code array in issued order.
      responses:
        "200":
          description: Privileged role activated and session created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionCredentials" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/auth/refresh:
    post:
      tags: [Sessions]
      security: []
      summary: Rotate a device-bound refresh token once
      operationId: refreshSession
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: Token rotated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionCredentials" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "409": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/auth/step-up:
    post:
      tags: [MFA]
      summary: Verify TOTP and issue a five-minute action-bound proof
      operationId: createStepUpProof
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StepUpRequest" }
      responses:
        "201":
          description: Proof issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StepUpProof" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/auth/logout:
    post:
      tags: [Sessions]
      summary: Revoke the current session
      operationId: logout
      responses:
        "204": { description: Session revoked. }
        "401": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/auth/me:
    get:
      tags: [Account]
      summary: Read the caller's minimal identity and authentication status
      operationId: getCurrentUser
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/auth/sessions:
    get:
      tags: [Sessions]
      summary: List the caller's devices and sessions
      operationId: listSessions
      responses:
        "200":
          description: Sessions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/auth/sessions/{session_id}:
    delete:
      tags: [Sessions]
      summary: Revoke one session or device remotely
      operationId: revokeSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204": { description: Session revoked. }
        "404": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/auth/identities:
    get:
      tags: [Identities]
      summary: List linked social identities without exposing provider tokens
      operationId: listSocialIdentities
      responses:
        "200":
          description: Linked identities.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LinkedIdentity" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/auth/identities/link:
    post:
      tags: [Identities]
      summary: Link an identity after fresh provider authentication and privileged TOTP
      operationId: linkSocialIdentity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge_id, authorization_code, identity_token, code_verifier]
              properties:
                challenge_id: { type: string, format: uuid }
                authorization_code: { type: string, writeOnly: true }
                identity_token: { type: string, writeOnly: true }
                code_verifier: { type: string, minLength: 43, maxLength: 128, writeOnly: true }
                totp_code: { type: string, pattern: "^[0-9]{6}$", writeOnly: true }
      responses:
        "201":
          description: Identity linked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkedIdentity" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "409": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/auth/identities/{provider}:
    delete:
      tags: [Identities]
      summary: Unlink a provider unless it is the final identity
      operationId: unlinkSocialIdentity
      parameters:
        - $ref: "#/components/parameters/Provider"
      responses:
        "204": { description: Identity unlinked. }
        "409": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/access-requests:
    get:
      tags: [Access requests]
      summary: List pending social registrations (Owner only)
      operationId: listAccessRequests
      responses:
        "200":
          description: Pending requests.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AccessRequest" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/access-requests/{user_id}/approve:
    post:
      tags: [Access requests]
      summary: Approve a pending account with Viewer access (Owner only)
      operationId: approveAccessRequest
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Viewer access granted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
        "409": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/account:
    delete:
      tags: [Account]
      summary: Delete the current account, erase PII, and revoke provider credentials and sessions
      operationId: deleteAccount
      responses:
        "204": { description: Account deleted and audit actor pseudonymized. }
        "409": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/opportunities:
    get:
      tags: [Opportunities]
      summary: List the latest ranked paper funding-arbitrage opportunities
      operationId: listOpportunities
      parameters:
        - in: query
          name: route_type
          required: false
          schema: { $ref: "#/components/schemas/RouteType" }
        - in: query
          name: venue
          required: false
          schema: { $ref: "#/components/schemas/Venue" }
        - in: query
          name: underlying
          required: false
          schema: { type: string }
        - in: query
          name: funding_direction
          required: false
          schema: { $ref: "#/components/schemas/FundingDirection" }
        - in: query
          name: min_net_apr
          required: false
          schema: { type: number }
        - in: query
          name: min_probability
          required: false
          schema: { type: number, minimum: 0, maximum: 1 }
        - in: query
          name: max_basis_bps
          required: false
          schema: { type: number }
        - in: query
          name: max_time_to_funding_secs
          required: false
          schema: { type: integer, format: int64 }
        - in: query
          name: sort
          required: false
          schema:
            type: string
            enum: [default, net_apr, next_funding, probability, capacity, expected_pnl]
      responses:
        "200":
          description: The latest scan snapshot (empty when no scan has run yet).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpportunityScan" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/opportunities/{route_id}:
    get:
      tags: [Opportunities]
      summary: Fetch full detail for one opportunity from the latest scan
      operationId: getOpportunity
      parameters:
        - in: path
          name: route_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The opportunity detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Opportunity" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
        "404": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/risk/limits:
    get:
      tags: [Opportunities]
      summary: Read the active safe-starter risk limits
      operationId: getRiskLimits
      responses:
        "200":
          description: The active organization risk limits.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskLimits" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/positions:
    get:
      tags: [Positions]
      summary: List opened paper positions (newest first)
      operationId: listPositions
      responses:
        "200":
          description: The opened paper positions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PositionList" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
    post:
      tags: [Positions]
      summary: Open a paper position from a ranked route
      description: >-
        Requires an active OWNER or TRADER. Sizes each leg to the requested
        notional (defaulting to the route's risk reservation) and simulates a
        deterministic paired taker fill. Send an Idempotency-Key header to make
        the open safe to retry; a repeat with the same key returns the existing
        position with a 200 rather than opening a duplicate.
      operationId: createPosition
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpenPositionRequest" }
      responses:
        "200":
          description: The existing position for a repeated Idempotency-Key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Position" }
        "201":
          description: The newly opened paper position.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Position" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
        "404": { $ref: "#/components/responses/ProblemResponse" }
        "409": { $ref: "#/components/responses/ProblemResponse" }
        "422": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/positions/{id}:
    get:
      tags: [Positions]
      summary: Fetch one opened paper position by id
      operationId: getPosition
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The paper position.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Position" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
        "404": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/positions/{id}/close:
    post:
      tags: [Positions]
      summary: Close an open paper position
      description: >-
        Requires an active OWNER or TRADER. Captures funding for the settlements
        the position was open across, flattens both legs, and records realized
        PnL. Idempotent: an already-closed position is returned unchanged; a
        non-open position is rejected with 409.
      operationId: closePosition
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The closed paper position.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Position" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
        "404": { $ref: "#/components/responses/ProblemResponse" }
        "409": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/controls:
    get:
      tags: [Controls]
      summary: List active circuit breakers
      operationId: getControls
      responses:
        "200":
          description: Effective paper controls.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Controls" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/controls/halt:
    post:
      tags: [Controls]
      summary: Halt new risk or enter read-only mode
      operationId: halt
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HaltRequest" }
      responses:
        "200":
          description: Active breaker.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CircuitBreaker" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
        "422": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/controls/venues/{venue}/disable:
    post:
      tags: [Controls]
      summary: Disable new exposure on a venue
      operationId: disableVenue
      parameters:
        - in: path
          name: venue
          required: true
          schema: { $ref: "#/components/schemas/Venue" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ControlReasonRequest" }
      responses:
        "200":
          description: Active venue breaker.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CircuitBreaker" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
        "404": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/controls/flatten:
    post:
      tags: [Controls]
      summary: Request OWNER-only emergency flatten
      operationId: flatten
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ControlReasonRequest" }
      responses:
        "200":
          description: Active flatten breaker.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CircuitBreaker" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/controls/resume:
    post:
      tags: [Controls]
      summary: Resolve operator-created controls
      operationId: resumeControls
      responses:
        "200":
          description: Number of resolved controls.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [resolved]
                properties:
                  resolved: { type: integer, minimum: 0 }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/auth/apple/notifications:
    post:
      tags: [Provider notifications]
      security: []
      summary: Process a signed Sign in with Apple server notification
      operationId: processAppleServerNotification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [payload]
              properties:
                payload: { type: string, writeOnly: true }
      responses:
        "204": { description: Valid notification processed idempotently. }
        "401": { $ref: "#/components/responses/ProblemResponse" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SessionId:
      in: path
      name: session_id
      required: true
      schema: { type: string, format: uuid }
    UserId:
      in: path
      name: user_id
      required: true
      schema: { type: string, format: uuid }
    Provider:
      in: path
      name: provider
      required: true
      schema: { $ref: "#/components/schemas/SocialProvider" }
  responses:
    HealthResponse:
      description: Service is healthy.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Health" }
    ProblemResponse:
      description: Request rejected without exposing authentication secrets.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    SocialProvider:
      type: string
      enum: [APPLE, GOOGLE]
    AuthNextState:
      type: string
      enum: [PENDING_APPROVAL, MFA_REQUIRED, MFA_ENROLLMENT_REQUIRED, AUTHENTICATED]
    UserStatus:
      type: string
      enum: [PENDING, ACTIVE, SUSPENDED, DELETED]
    Role:
      type: string
      enum: [VIEWER, OWNER, TRADER, APPROVER]
    Venue:
      type: string
      enum: [BINANCE, BYBIT, OKX, DYDX, HYPERLIQUID]
    RouteType:
      type: string
      enum: [SPOT_PERP, PERP_PERP]
    FundingDirection:
      type: string
      enum: [POSITIVE, NEGATIVE]
    OpportunityLeg:
      type: object
      additionalProperties: false
      required: [venue, predicted_rate, p10_rate, p90_rate, direction_probability, next_funding_at]
      properties:
        venue: { $ref: "#/components/schemas/Venue" }
        predicted_rate: { type: number }
        p10_rate: { type: number }
        p90_rate: { type: number }
        direction_probability: { type: number, minimum: 0, maximum: 1 }
        next_funding_at: { type: string, format: date-time }
    RiskLimits:
      type: object
      additionalProperties: false
      required:
        - reference_equity
        - max_portfolio_fraction
        - max_opportunity_fraction
        - max_underlying_fraction
        - max_venue_fraction
        - max_leverage
        - min_profitability
        - min_net_apr
        - max_entry_basis_bps
        - min_depth_multiple
        - max_unmatched_usd
        - max_daily_loss_fraction
        - max_drawdown_fraction
      properties:
        reference_equity: { type: number }
        max_portfolio_fraction: { type: number }
        max_opportunity_fraction: { type: number }
        max_underlying_fraction: { type: number }
        max_venue_fraction: { type: number }
        max_leverage: { type: number }
        min_profitability: { type: number }
        min_net_apr: { type: number }
        max_entry_basis_bps: { type: number }
        min_depth_multiple: { type: number }
        max_unmatched_usd: { type: number }
        max_daily_loss_fraction: { type: number, minimum: 0, maximum: 1 }
        max_drawdown_fraction: { type: number, minimum: 0, maximum: 1 }
    Opportunity:
      type: object
      additionalProperties: false
      required:
        - route_id
        - route_type
        - underlying
        - funding_direction
        - long_venue
        - short_venue
        - gross_funding_apr
        - entry_cost
        - exit_cost
        - carry_cost
        - risk_buffer
        - break_even_funding
        - net_apr
        - expected_net_pnl
        - profitability_probability
        - entry_basis_bps
        - leverage
        - required_capital
        - available_capacity
        - reserved_notional
        - reserved_capital
        - capital_fraction
        - within_limits
        - long_leg
        - short_leg
        - next_funding_at
      properties:
        route_id: { type: string }
        route_type: { $ref: "#/components/schemas/RouteType" }
        underlying: { type: string }
        funding_direction: { $ref: "#/components/schemas/FundingDirection" }
        long_venue: { $ref: "#/components/schemas/Venue" }
        short_venue: { $ref: "#/components/schemas/Venue" }
        gross_funding_apr: { type: number }
        entry_cost: { type: number }
        exit_cost: { type: number }
        carry_cost: { type: number }
        risk_buffer: { type: number }
        break_even_funding: { type: number }
        net_apr: { type: number }
        expected_net_pnl: { type: number }
        profitability_probability: { type: number, minimum: 0, maximum: 1 }
        entry_basis_bps: { type: number }
        leverage: { type: number }
        required_capital: { type: number }
        available_capacity: { type: number }
        reserved_notional: { type: number }
        reserved_capital: { type: number }
        capital_fraction: { type: number }
        within_limits: { type: boolean }
        long_leg: { $ref: "#/components/schemas/OpportunityLeg" }
        short_leg: { $ref: "#/components/schemas/OpportunityLeg" }
        next_funding_at: { type: string, format: date-time }
    OpportunityScan:
      type: object
      additionalProperties: false
      required: [scanned_at, model_version, opportunities]
      properties:
        scanned_at:
          type: string
          description: RFC 3339 scan timestamp, or empty when no scan has run yet.
        model_version: { type: string }
        opportunities:
          type: array
          items: { $ref: "#/components/schemas/Opportunity" }
    PositionState:
      type: string
      enum: [QUALIFIED, RESERVED, OPENING, OPEN, OPEN_FAILED, RECOVERING, REHEDGING, CLOSING, CLOSED]
    ExitReason:
      type: string
      enum: [FUNDING_FLIP, THRESHOLD_BREACH, VENUE_UNHEALTHY, MANUAL, RECOVERY_FAILURE, CIRCUIT_BREAKER]
    FillOutcome:
      type: object
      additionalProperties: false
      required: [outcome]
      properties:
        outcome: { type: string, enum: [FULL, PARTIAL, UNKNOWN] }
        fraction: { type: number, exclusiveMinimum: 0, maximum: 1 }
        reconciled_fraction: { type: number, exclusiveMinimum: 0, maximum: 1 }
    PaperFillScenario:
      type: object
      additionalProperties: false
      required: [long, short]
      properties:
        long: { $ref: "#/components/schemas/FillOutcome" }
        short: { $ref: "#/components/schemas/FillOutcome" }
    OpenPositionRequest:
      type: object
      additionalProperties: false
      required: [route_id]
      properties:
        route_id: { type: string }
        notional:
          type: number
          description: Notional (USD) to size each leg to; defaults to the reservation.
        fill_scenario:
          $ref: "#/components/schemas/PaperFillScenario"
    BreakerScope:
      type: string
      enum: [GLOBAL, VENUE, STRATEGY]
    BreakerAction:
      type: string
      enum: [HALT_NEW_RISK, DISABLE_VENUE, READ_ONLY, FLATTEN]
    CircuitBreaker:
      type: object
      additionalProperties: false
      required: [id, scope, action, source, reason, active, created_at]
      properties:
        id: { type: string, format: uuid }
        scope: { $ref: "#/components/schemas/BreakerScope" }
        scope_key: { type: [string, "null"] }
        action: { $ref: "#/components/schemas/BreakerAction" }
        source: { type: string }
        reason: { type: string }
        created_by: { type: [string, "null"] }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
        resolved_at: { type: [string, "null"], format: date-time }
    Controls:
      type: object
      additionalProperties: false
      required: [effective_action, breakers]
      properties:
        effective_action:
          anyOf:
            - { $ref: "#/components/schemas/BreakerAction" }
            - { type: "null" }
        breakers:
          type: array
          items: { $ref: "#/components/schemas/CircuitBreaker" }
    HaltRequest:
      type: object
      additionalProperties: false
      properties:
        action: { type: string, enum: [HALT_NEW_RISK, READ_ONLY], default: HALT_NEW_RISK }
        reason: { type: string }
    ControlReasonRequest:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string }
    PaperOrder:
      type: object
      additionalProperties: false
      required: [client_order_id, side, target_qty, price_cap, time_in_force]
      properties:
        client_order_id: { type: string }
        side: { type: string, enum: [BUY, SELL] }
        target_qty: { type: number }
        price_cap: { type: number }
        time_in_force: { type: string }
    PaperFill:
      type: object
      additionalProperties: false
      required: [client_order_id, qty, price, fee]
      properties:
        client_order_id: { type: string }
        qty: { type: number }
        price: { type: number }
        fee: { type: number }
    PositionLeg:
      type: object
      additionalProperties: false
      required:
        - venue
        - symbol
        - is_long
        - mark_price
        - funding_rate
        - funding_interval_hours
        - target_qty
        - filled_qty
        - avg_fill_price
        - fees
        - orders
        - fills
      properties:
        venue: { $ref: "#/components/schemas/Venue" }
        symbol: { type: string }
        is_long: { type: boolean }
        mark_price: { type: number }
        funding_rate: { type: number }
        funding_interval_hours: { type: integer, minimum: 1 }
        target_qty: { type: number }
        filled_qty: { type: number }
        avg_fill_price: { type: number }
        fees: { type: number }
        orders:
          type: array
          items: { $ref: "#/components/schemas/PaperOrder" }
        fills:
          type: array
          items: { $ref: "#/components/schemas/PaperFill" }
    Position:
      type: object
      additionalProperties: false
      required:
        - id
        - route_id
        - underlying
        - route_type
        - funding_direction
        - state
        - target_notional
        - reserved_capital
        - residual_delta_usd
        - residual_breach_ticks
        - exit_reason
        - funding_captured
        - realized_pnl
        - opened_at
        - long_leg
        - short_leg
      properties:
        id: { type: string, format: uuid }
        route_id: { type: string }
        underlying: { type: string }
        route_type: { $ref: "#/components/schemas/RouteType" }
        funding_direction: { $ref: "#/components/schemas/FundingDirection" }
        state: { $ref: "#/components/schemas/PositionState" }
        target_notional: { type: number }
        reserved_capital: { type: number }
        residual_delta_usd: { type: number }
        residual_breach_ticks: { type: integer, minimum: 0 }
        exit_reason:
          anyOf:
            - { $ref: "#/components/schemas/ExitReason" }
            - { type: "null" }
        funding_captured: { type: number }
        realized_pnl: { type: number }
        opened_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time }
        long_leg: { $ref: "#/components/schemas/PositionLeg" }
        short_leg: { $ref: "#/components/schemas/PositionLeg" }
    PositionList:
      type: object
      additionalProperties: false
      required: [positions]
      properties:
        positions:
          type: array
          items: { $ref: "#/components/schemas/Position" }
    CreateSocialChallengeRequest:
      type: object
      additionalProperties: false
      required: [provider, redirect_uri, code_challenge, purpose]
      properties:
        provider: { $ref: "#/components/schemas/SocialProvider" }
        purpose: { type: string, enum: [SIGN_IN, LINK_IDENTITY] }
        redirect_uri: { type: string, format: uri }
        code_challenge: { type: string, minLength: 43, maxLength: 128 }
    SocialChallenge:
      type: object
      additionalProperties: false
      required: [id, provider, state, nonce, expires_at]
      properties:
        id: { type: string, format: uuid }
        provider: { $ref: "#/components/schemas/SocialProvider" }
        state: { type: string, minLength: 32 }
        nonce: { type: string, minLength: 32 }
        expires_at: { type: string, format: date-time }
    SocialExchangeRequest:
      type: object
      additionalProperties: false
      required: [challenge_id, authorization_code, identity_token, code_verifier, device]
      properties:
        challenge_id: { type: string, format: uuid }
        authorization_code: { type: string, writeOnly: true }
        identity_token: { type: string, writeOnly: true }
        code_verifier: { type: string, minLength: 43, maxLength: 128, writeOnly: true }
        apple_profile:
          type: object
          additionalProperties: false
          properties:
            display_name: { type: string, maxLength: 200 }
        device: { $ref: "#/components/schemas/DeviceRegistration" }
    DeviceRegistration:
      type: object
      additionalProperties: false
      required: [installation_id, platform, app_version, display_name]
      properties:
        installation_id: { type: string, minLength: 16, writeOnly: true }
        platform: { const: IOS }
        app_version: { type: string }
        display_name: { type: string, maxLength: 100 }
    AuthTransition:
      type: object
      additionalProperties: false
      required: [next, user]
      properties:
        next: { $ref: "#/components/schemas/AuthNextState" }
        user: { $ref: "#/components/schemas/CurrentUser" }
        challenge_token: { type: string, writeOnly: true }
        session: { $ref: "#/components/schemas/SessionCredentials" }
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, status, roles, linked_providers, mfa_enrolled]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/UserStatus" }
        display_name: { type: [string, "null"] }
        email: { type: [string, "null"], format: email }
        roles:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/Role" }
        linked_providers:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/SocialProvider" }
        mfa_enrolled: { type: boolean }
    MfaEnrollment:
      type: object
      additionalProperties: false
      required: [method_id, secret, otpauth_uri]
      properties:
        method_id: { type: string, format: uuid }
        secret: { type: string, writeOnly: true }
        otpauth_uri: { type: string, writeOnly: true }
    MfaCodeRequest:
      type: object
      additionalProperties: false
      required: [challenge_token, code]
      properties:
        challenge_token: { type: string, writeOnly: true }
        code: { type: string, minLength: 6, maxLength: 64, writeOnly: true }
        recovery_code: { type: boolean, default: false }
        recovery_codes_acknowledged: { type: boolean, default: false }
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token, device_id]
      properties:
        refresh_token: { type: string, minLength: 43, writeOnly: true }
        device_id: { type: string, format: uuid }
    SessionCredentials:
      type: object
      additionalProperties: false
      required: [access_token, access_token_expires_at, refresh_token, session_id, device_id]
      properties:
        access_token: { type: string, writeOnly: true }
        access_token_expires_at: { type: string, format: date-time }
        refresh_token: { type: string, writeOnly: true }
        session_id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
    Session:
      type: object
      additionalProperties: false
      required: [id, device_id, device_name, current, created_at, last_seen_at]
      properties:
        id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        device_name: { type: string }
        current: { type: boolean }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
    LinkedIdentity:
      type: object
      additionalProperties: false
      required: [provider, linked_at, last_authenticated_at]
      properties:
        provider: { $ref: "#/components/schemas/SocialProvider" }
        profile_email: { type: [string, "null"], format: email }
        linked_at: { type: string, format: date-time }
        last_authenticated_at: { type: string, format: date-time }
    AccessRequest:
      type: object
      additionalProperties: false
      required: [user_id, provider, requested_at]
      properties:
        user_id: { type: string, format: uuid }
        provider: { $ref: "#/components/schemas/SocialProvider" }
        display_name: { type: [string, "null"] }
        email: { type: [string, "null"], format: email }
        requested_at: { type: string, format: date-time }
    StepUpRequest:
      type: object
      additionalProperties: false
      required: [action, totp_code]
      properties:
        action: { type: string, minLength: 1 }
        resource_id: { type: string }
        resource_version: { type: integer, minimum: 1 }
        command_digest: { type: string, pattern: "^[a-f0-9]{64}$" }
        totp_code: { type: string, pattern: "^[0-9]{6}$", writeOnly: true }
    StepUpProof:
      type: object
      additionalProperties: false
      required: [proof, expires_at]
      properties:
        proof: { type: string, writeOnly: true }
        expires_at: { type: string, format: date-time }
    Health:
      type: object
      additionalProperties: false
      required: [status, mode, stage]
      properties:
        status: { const: OK }
        mode: { const: PAPER }
        stage: { enum: [M0_SCAFFOLD, M1_AUTH] }
    EntryReadiness:
      type: object
      additionalProperties: false
      required: [status, reasons]
      properties:
        status: { const: BLOCKED }
        reasons:
          type: array
          items: { type: string }
    Problem:
      type: object
      description: RFC 9457 problem details with a stable Perpeto code and correlation request ID.
      additionalProperties: false
      required: [type, title, status, code, request_id]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { type: string }
        request_id: { type: string, format: uuid }
        instance: { type: string, format: uri-reference }
