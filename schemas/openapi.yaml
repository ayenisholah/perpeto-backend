        "200":
          description: The opportunity detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Opportunity" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
        "404": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/risk/limits:
    get:
      tags: [Opportunities]
      summary: Read the active safe-starter risk limits
      operationId: getRiskLimits
      responses:
        "200":
          description: The active organization risk limits.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskLimits" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/positions:
    get:
      tags: [Positions]
      summary: List opened paper positions (newest first)
      operationId: listPositions
      responses:
        "200":
          description: The opened paper positions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PositionList" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
    post:
      tags: [Positions]
      summary: Open a paper position from a ranked route
      description: >-
        Requires an active OWNER or TRADER. Sizes each leg to the requested
        notional (defaulting to the route's risk reservation) and simulates a
        deterministic paired taker fill. Send an Idempotency-Key header to make
        the open safe to retry; a repeat with the same key returns the existing
        position with a 200 rather than opening a duplicate.
      operationId: createPosition
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpenPositionRequest" }
      responses:
        "200":
          description: The existing position for a repeated Idempotency-Key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Position" }
        "201":
          description: The newly opened paper position.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Position" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
        "404": { $ref: "#/components/responses/ProblemResponse" }
        "409": { $ref: "#/components/responses/ProblemResponse" }
        "422": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/positions/{id}:
    get:
      tags: [Positions]
      summary: Fetch one opened paper position by id
      operationId: getPosition
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The paper position.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Position" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
        "404": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/positions/{id}/close:
    post:
      tags: [Positions]
      summary: Close an open paper position
      description: >-
        Requires an active OWNER or TRADER. Captures funding for the settlements
        the position was open across, flattens both legs, and records realized
        PnL. Idempotent: an already-closed position is returned unchanged; a
        non-open position is rejected with 409.
      operationId: closePosition
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The closed paper position.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Position" }
        "401": { $ref: "#/components/responses/ProblemResponse" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
        "404": { $ref: "#/components/responses/ProblemResponse" }
        "409": { $ref: "#/components/responses/ProblemResponse" }
