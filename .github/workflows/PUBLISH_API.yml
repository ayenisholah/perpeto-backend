name: Publish API Client

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: SemVer package version
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/api-client
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          cache: npm
          cache-dependency-path: packages/api-client/package-lock.json
      - name: Resolve package metadata
        shell: bash
        run: |
          # The api-client tracks the OpenAPI contract version and is versioned
          # independently of the Rust workspace release tag. A manual dispatch may
          # override; a release publish uses the committed package.json version.
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          VERSION="${VERSION#v}"
          npm pkg set "name=@${GITHUB_REPOSITORY_OWNER,,}/perpeto-api-client"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test
      - run: npm run verify:package
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Request mobile compatibility update
        if: vars.API_UPDATE_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          # The package version resolved above, never the workspace release tag.
          gh workflow run API_UPDATE.yml --repo "${{ github.repository_owner }}/perpeto-mobile" --field "version=$VERSION"
