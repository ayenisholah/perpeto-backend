name: Backend Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  packages: write

concurrency:
  group: backend-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Verify tag matches the workspace version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$TAG" != "$VER" ]; then
            echo "tag v$TAG does not match [workspace.package] version $VER" >&2
            exit 1
          fi

      - name: Extract changelog notes
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v ver="$VER" '
            index($0, "## [" ver "]") == 1 { cap = 1; next }
            cap && index($0, "## [") == 1 { exit }
            cap { print }
          ' docs/CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No changelog section found for $VER" >&2
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "Perpeto backend $GITHUB_REF_NAME" --notes-file notes.md

      # Promote the immutable sha image built on main to the release semver + latest.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag container image with the release version
        shell: bash
        run: |
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          SRC="${REPO}:sha-${GITHUB_SHA}"
          if docker buildx imagetools inspect "$SRC" >/dev/null 2>&1; then
            docker buildx imagetools create --tag "${REPO}:${GITHUB_REF_NAME}" --tag "${REPO}:latest" "$SRC"
          else
            echo "::warning::Image $SRC not found; skipping semver retag. Ensure the Backend Container build for this commit finished first."
          fi
