name: Deploy Staging

# PAPER staging runs on one EC2 host in eu-north-1 (DEC-0020): the CDK app in
# infra/ owns the host, and each deploy reaches it through SSM Run Command, so
# there is no SSH key to rotate. The AWS organisation's service control policy
# forbids GitHub OIDC, so the job uses the scoped perpeto-github-deployer IAM
# user (infra/lib/deployer-stack.ts); rotate its key with
# scripts/aws/create-deploy-key.sh.

on:
  workflow_run:
    workflows: ["Backend Container"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_sha:
        description: Full source commit SHA to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: perpeto-staging-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.STAGING_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    environment:
      name: staging
      url: https://api.perpeto.xyz
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Resolve source revision
        id: source
        shell: bash
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.image_sha }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then sha="$RUN_SHA"; else sha="$INPUT_SHA"; fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "expected a full commit SHA" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Infrastructure (CDK)
        working-directory: infra
        run: |
          npm ci
          npx cdk deploy --all --require-approval never
      - name: Deploy the image to the host through SSM
        env:
          SHA: ${{ steps.source.outputs.sha }}
          IMAGE: ghcr.io/${{ github.repository }}:sha-${{ steps.source.outputs.sha }}
        run: bash scripts/aws/deploy-host.sh "$SHA" "$IMAGE"
