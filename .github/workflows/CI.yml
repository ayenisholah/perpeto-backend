name: Backend CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate project documents
        run: bash scripts/check-docs.sh

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: perpeto
          POSTGRES_PASSWORD: perpeto
          POSTGRES_DB: perpeto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U perpeto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # `perpeto` is the container superuser and owns every table, so it is only
      # ever used to bootstrap roles. Migrations run as the schema owner and the
      # tests run as the non-owning, non-bypassing runtime role: `assert_safe_
      # runtime_role` rejects anything else, and the forced-RLS isolation tests
      # cannot fail as a superuser because superusers bypass RLS unconditionally.
      BOOTSTRAP_DATABASE_URL: postgres://perpeto:perpeto@localhost:5432/perpeto
      MIGRATE_DATABASE_URL: postgres://perpeto_migrator:perpeto_migrator@localhost:5432/perpeto
      DATABASE_URL: postgres://perpeto_app:perpeto_app@localhost:5432/perpeto
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component clippy --component rustfmt --component llvm-tools-preview
          rustup default 1.97.0
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build documentation (warnings are errors)
        run: cargo doc --locked --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Provision database roles
        run: psql "$BOOTSTRAP_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/bootstrap-db-roles.sql
      - name: Apply database migrations
        run: cargo run --locked --bin funding-arb-migrate
        env:
          DATABASE_URL: ${{ env.MIGRATE_DATABASE_URL }}
      # Runs the whole test suite once, instrumented. Compiler warnings fail the
      # build, and coverage below the floor fails the job. The floor is a
      # ratchet: raise it as coverage grows, never lower it.
      - name: Run tests with coverage
        run: cargo llvm-cov --locked --workspace --summary-only --fail-under-lines "$COVERAGE_FLOOR"
        env:
          RUSTFLAGS: -D warnings
          COVERAGE_FLOOR: "38"

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/api-client
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/api-client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify:package
      - run: npm audit --audit-level=high
      - name: Validate OpenAPI
        working-directory: .
        run: npx --yes @redocly/cli@2.3.0 lint schemas/openapi.yaml

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # No AWS credentials: the stacks avoid context lookups, so synth is offline.
      - run: npm run synth
      - run: npm audit --audit-level=high
      - name: Validate the one-command local stack
        working-directory: .
        run: docker compose config --quiet
      - name: Validate the staging compose stack with the AWS override
        working-directory: .
        run: |
          host="$(mktemp -d)"
          mkdir -p "$host/deploy/compose" "$host/deploy/ec2"
          cp deploy/compose/docker-compose.staging.yml deploy/compose/docker-compose.aws.yml "$host/deploy/compose/"
          cp deploy/ec2/Caddyfile "$host/deploy/ec2/"
          {
            cat deploy/ec2/staging.env
            echo "POSTGRES_PASSWORD=ci"
            echo "MIGRATE_DATABASE_URL=postgres://perpeto_migrator:ci@postgres:5432/perpeto"
            echo "DATABASE_URL=postgres://perpeto_app:ci@postgres:5432/perpeto"
            echo "AWS_REGION=eu-north-1"
            echo "PERPETO_LOG_GROUP=/perpeto/staging"
            echo "PERPETO_PUBLIC_HOSTS=api.perpeto.xyz, 127.0.0.1.sslip.io"
            echo "PERPETO_APP_HOST=app.perpeto.xyz"
            echo "PERPETO_APP_ALIAS=app.127.0.0.1.sslip.io"
          } > "$host/runtime.env"
          {
            echo "PERPETO_API_URL=http://api:8080"
            echo "PERPETO_WEB_ORIGIN=https://app.perpeto.xyz"
            echo "PERPETO_WEB_SESSION_KEY=ci"
          } > "$host/web.env"
          cd "$host"
          for profiles in "" web connectors; do
            COMPOSE_PROFILES="$profiles" PERPETO_IMAGE=ghcr.io/example/perpeto:ci docker compose --env-file runtime.env \
              -f deploy/compose/docker-compose.staging.yml -f deploy/compose/docker-compose.aws.yml config --quiet
          done
          docker run --rm -v "$GITHUB_WORKSPACE/deploy/ec2/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e PERPETO_PUBLIC_HOSTS="api.perpeto.xyz" -e PERPETO_APP_HOST="app.perpeto.xyz" -e PERPETO_APP_ALIAS="app.127.0.0.1.sslip.io" \
            caddy:2.10.2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          for script in deploy/ec2/refresh.sh deploy/ec2/update-web.sh scripts/deploy-staging.sh scripts/aws/deploy-host.sh scripts/aws/create-deploy-key.sh; do
            bash -n "$GITHUB_WORKSPACE/$script"
          done

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
