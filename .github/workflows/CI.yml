name: Backend CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate project documents
        run: bash scripts/check-docs.sh

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: perpeto
          POSTGRES_PASSWORD: perpeto
          POSTGRES_DB: perpeto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U perpeto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # `perpeto` is the container superuser and owns every table, so it is only
      # ever used to bootstrap roles. Migrations run as the schema owner and the
      # tests run as the non-owning, non-bypassing runtime role: `assert_safe_
      # runtime_role` rejects anything else, and the forced-RLS isolation tests
      # cannot fail as a superuser because superusers bypass RLS unconditionally.
      BOOTSTRAP_DATABASE_URL: postgres://perpeto:perpeto@localhost:5432/perpeto
      MIGRATE_DATABASE_URL: postgres://perpeto_migrator:perpeto_migrator@localhost:5432/perpeto
      DATABASE_URL: postgres://perpeto_app:perpeto_app@localhost:5432/perpeto
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component clippy --component rustfmt --component llvm-tools-preview
          rustup default 1.97.0
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build documentation (warnings are errors)
        run: cargo doc --locked --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Provision database roles
        run: psql "$BOOTSTRAP_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/bootstrap-db-roles.sql
      - name: Apply database migrations
        run: cargo run --locked --bin funding-arb-migrate
        env:
          DATABASE_URL: ${{ env.MIGRATE_DATABASE_URL }}
      # Runs the whole test suite once, instrumented. Compiler warnings fail the
      # build, and coverage below the floor fails the job. The floor is a
      # ratchet: raise it as coverage grows, never lower it.
      - name: Run tests with coverage
        run: cargo llvm-cov --locked --workspace --summary-only --fail-under-lines "$COVERAGE_FLOOR"
        env:
          RUSTFLAGS: -D warnings
          COVERAGE_FLOOR: "26"

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/api-client
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/api-client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify:package
      - run: npm audit --audit-level=high
      - name: Validate OpenAPI
        working-directory: .
        run: npx --yes @redocly/cli@2.3.0 lint schemas/openapi.yaml

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
